<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME CALL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      font-size: 18px;
    }

    button {
      margin-top: 30px;
      padding: 18px 50px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #00c853;
      color: white;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HOME CALL</h1>

    <p>Siap melakukan panggilan</p>

    <button onclick="panggil()">
      PANGGIL
    </button>

  </div>

  <script>
    function panggil() {
      alert("Tombol PANGGIL berhasil ditekan!");
    }
  </script>

</body>
</html>
